<!DOCTYPE html>
<html lang="th">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>ตารางแข่งขัน & Leaderboard - Future Engineers</title>

  <!-- Font Prompt & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --fe-cyan: #00a8e8;
      --fe-blue: #005696;
      --fe-gradient: linear-gradient(135deg, #00a8e8 0%, #005696 100%);
      --fe-light-bg: #e0f2fe;

      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 1080px;
      overflow-x: hidden;
    }

    .tv-container {
      max-width: 1840px;
      margin: 0 auto;
      padding: 24px 20px 20px 20px;
    }

    /* Header Bar */
    .tv-header {
      background-color: var(--card-bg);
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      padding: 16px 32px;
      box-shadow: 0 4px 20px rgba(0, 86, 150, 0.08);
    }

    /* Logo Box Header Styling */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-theme-box,
    .logo-fe-box {
      background-color: #ffffff;
      border: 2px solid #e0f2fe;
      padding: 2px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 62px;
      width: 62px;
      box-shadow: 0 2px 8px rgba(0, 168, 232, 0.12);
      overflow: hidden;
    }

    .logo-theme-box img,
    .logo-fe-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .tv-title {
      font-size: 2rem;
      font-weight: 700;
      background: var(--fe-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .tv-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Navigation Switcher Tabs */
    .tv-nav-switcher {
      background-color: #f1f5f9;
      padding: 6px;
      border-radius: 14px;
      display: flex;
      gap: 6px;
      border: 1px solid #e2e8f0;
    }

    .tv-nav-btn {
      font-size: 1.25rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #64748b;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .tv-nav-btn.active {
      background: var(--fe-gradient);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 168, 232, 0.3);
    }

    /* Inline Select Control */
    .tv-select-group {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .tv-label {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0;
    }

    .tv-select {
      font-size: 1.3rem !important;
      font-weight: 600 !important;
      background-color: #ffffff !important;
      color: var(--fe-blue) !important;
      border: 2px solid var(--fe-cyan) !important;
      border-radius: 12px !important;
      padding: 6px 40px 6px 16px !important;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 168, 232, 0.15);
    }

    /* Table Container */
    .tv-table-container {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 86, 150, 0.06);
    }

    .table-tv {
      width: 100%;
      margin-bottom: 0;
    }

    .table-tv thead {
      background: var(--fe-gradient);
    }

    .table-tv th {
      background: transparent !important;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 18px 20px;
      border: none;
      letter-spacing: 0.5px;
    }

    .table-tv td {
      font-size: 1.35rem;
      padding: 16px 20px;
      vertical-align: middle;
      border-bottom: 1px solid #e2e8f0;
    }

    .team-name-text {
      color: #000000 !important;
      font-weight: 700;
      font-size: 1.45rem;
    }

    .table-tv tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .table-tv tbody tr:hover {
      background-color: #f0f9ff;
    }

    .badge-order {
      background-color: var(--fe-light-bg);
      color: var(--fe-blue);
      font-size: 1.4rem;
      font-weight: 700;
      padding: 6px 20px;
      border-radius: 10px;
      display: inline-block;
      min-width: 60px;
      text-align: center;
      border: 1px solid #bae6fd;
    }

    .badge-id {
      background-color: #f1f5f9;
      color: #334155;
      font-size: 1.25rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }

    /* Leaderboard Rank Highlights (Top 3) */
    .rank-badge {
      font-size: 1.4rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 10px;
      display: inline-block;
      min-width: 60px;
      text-align: center;
    }

    .rank-1 {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    /* Gold */
    .rank-2 {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    /* Silver */
    .rank-3 {
      background-color: #ffedd5;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }

    /* Bronze */
    .rank-normal {
      background-color: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    /* ==================== ANIMATION SECTION ==================== */
    @keyframes rowFadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animated-row {
      opacity: 0;
      animation: rowFadeUp 0.4s ease-out forwards;
    }

    .loading-spinner {
      font-size: 1.8rem;
      color: var(--fe-cyan);
      padding: 90px 0;
    }

    /* Footer Layout */
    .tv-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: -30px;
      position: relative;
      z-index: 5;
    }

    .tv-footer-wro img {
      height: 160px;
      width: auto;
      object-fit: contain;
    }

    #leaderboardPage th:nth-child(1) {
      width: 10%;
    }

    #leaderboardPage th:nth-child(2) {
      width: 16%;
    }

    #leaderboardPage th:nth-child(3) {
      width: 26%;
    }

    #leaderboardPage th:nth-child(4) {
      width: 12%;
    }

    #leaderboardPage th:nth-child(5) {
      width: 12%;
    }

    #leaderboardPage th:nth-child(6) {
      width: 12%;
    }

    #leaderboardPage th:nth-child(7) {
      width: 12%;
    }
  </style>
</head>

<body>

  <div class="tv-container">

    <!-- Header Bar -->
    <div class="tv-header d-flex justify-content-between align-items-center mb-4">

      <!-- Left: Logos & Title -->
      <div class="logo-container">
        <div class="logo-theme-box">
          <img src="https://lh3.googleusercontent.com/d/1yFZy77lZ7JhSosxOG9YbD-p7Bzf3FBC8" id="themeLogo" alt="Theme Logo">
        </div>
        <div class="logo-fe-box">
          <img src="https://lh3.googleusercontent.com/d/1fTs3KrVQqUB7CHasWY_7jIRfHpdLeeEz" id="feLogo" alt="Future Engineers Logo">
        </div>
        <div class="ms-2">
          <div class="tv-title" id="pageTitle">ตารางการแข่งขัน Future Engineers</div>
          <div class="tv-subtitle">World Robot Olympiad Thailand</div>
        </div>
      </div>

      <!-- Middle: Page Navigation Switcher -->
      <div class="tv-nav-switcher">
        <button class="tv-nav-btn active" id="btnSchedule" onclick="switchPage('schedule')">ตารางแข่งขัน</button>
        <button class="tv-nav-btn" id="btnLeaderboard" onclick="switchPage('leaderboard')">Leaderboard</button>
      </div>

      <!-- Right: Dropdown -->
      <div class="tv-select-group" id="roundSelectGroup">
        <label for="roundSelect" class="tv-label">เลือกรอบ:</label>
        <select id="roundSelect" class="form-select tv-select" onchange="loadSchedule()">
        <option value="Round 1">Round 1</option>
        <option value="Round 2">Round 2</option>
        <option value="Round 3">Round 3</option>
        <option value="Round 4">Round 4</option>
      </select>
      </div>

    </div>

    <!-- Page 1: Schedule Table -->
    <div id="schedulePage" class="tv-table-container">
      <table class="table table-tv align-middle">
        <thead>
          <tr>
            <th style="width: 14%;" class="text-center">ลำดับแข่ง</th>
            <th style="width: 18%;">รหัสทีม</th>
            <th style="width: 38%;">ชื่อทีม</th>
            <th style="width: 30%;">สถาบัน / โรงเรียน</th>
          </tr>
        </thead>
        <tbody id="scheduleTableBody">
          <tr>
            <td colspan="4" class="text-center loading-spinner">
              <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
              <div>กำลังโหลดข้อมูลตารางแข่งขัน...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Page 2: Leaderboard Table -->
    <div id="leaderboardPage" class="tv-table-container d-none">
      <table class="table table-tv align-middle">
        <thead id="leaderboardHeader">
          <!-- JS Render Dynamic Headers -->
        </thead>
        <tbody id="leaderboardTableBody">
          <tr>
            <td colspan="7" class="text-center loading-spinner">
              <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
              <div>กำลังโหลดข้อมูล Leaderboard...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer WRO Logo -->
    <div class="tv-footer">
      <div class="tv-footer-wro">
        <img src="https://lh3.googleusercontent.com/d/1_xo4z-fSfB2uG2n1OOJKVABT9vW5fLQt" id="wroFooterLogo" alt="WRO Thailand Logo">
      </div>
    </div>

  </div>

  <script>
    // ⚠️ วาง URL ของ Google Apps Script Web App ที่ Deploy ไว้ตรงนี้
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzjtFG3cUm2BO-eXIJi2JKXJfx8ywVaWhtXYjTZSOSVGe71ONPkL8EHVOMaEmqt5mX/exec";

  let currentView = 'schedule';

  window.onload = function() {
    loadSchedule();
  };

  // ตัวจัดการดึงข้อมูลเบื้องหลังอัตโนมัติ (รองรับทั้ง GAS และ GitHub Pages)
  function callBackend(funcName, param) {
    return new Promise((resolve, reject) => {
      const isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

      if (isGasEnvironment) {
        if (funcName === 'getScheduleData') {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getScheduleData(param);
        } else if (funcName === 'getLeaderboardData') {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getLeaderboardData();
        }
      } else {
        let url = `${GAS_WEB_APP_URL}?action=${funcName}`;
        if (funcName === 'getScheduleData') {
          url += `&round=${encodeURIComponent(param)}`;
        }
        
        fetch(url)
          .then(res => res.json())
          .then(resolve)
          .catch(reject);
      }
    });
  }

  function switchPage(page) {
    currentView = page;
    const btnSchedule = document.getElementById('btnSchedule');
    const btnLeaderboard = document.getElementById('btnLeaderboard');
    const schedulePage = document.getElementById('schedulePage');
    const leaderboardPage = document.getElementById('leaderboardPage');
    const roundSelectGroup = document.getElementById('roundSelectGroup');
    const pageTitle = document.getElementById('pageTitle');

    if (page === 'schedule') {
      btnSchedule.classList.add('active');
      btnLeaderboard.classList.remove('active');
      schedulePage.classList.remove('d-none');
      leaderboardPage.classList.add('d-none');
      roundSelectGroup.classList.remove('d-none');
      pageTitle.innerText = "ตารางการแข่งขัน Future Engineers";
      loadSchedule();
    } else {
      btnLeaderboard.classList.add('active');
      btnSchedule.classList.remove('active');
      leaderboardPage.classList.remove('d-none');
      schedulePage.classList.add('d-none');
      roundSelectGroup.classList.add('d-none');
      pageTitle.innerText = "Leaderboard - Future Engineers";
      loadLeaderboard();
    }
  }

  /* ---------------- โหลดข้อมูล Schedule ---------------- */
  function loadSchedule() {
    const roundVal = document.getElementById('roundSelect').value;
    const tbody = document.getElementById('scheduleTableBody');

    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="text-center loading-spinner">
          <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
          <div>กำลังโหลดข้อมูล ${roundVal}...</div>
        </td>
      </tr>
    `;

    callBackend('getScheduleData', roundVal)
      .then(renderScheduleTable)
      .catch(showErrorSchedule);
  }

  function renderScheduleTable(res) {
    const tbody = document.getElementById('scheduleTableBody');

    if (res.status === "error") {
      showErrorSchedule(res.message);
      return;
    }

    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="4" class="text-center py-5 fs-3 text-muted">ไม่พบข้อมูลการแข่งขันในรอบนี้</td></tr>
      `;
      return;
    }

    let html = '';
    res.data.forEach((item) => {
      html += `
        <tr>
          <td class="text-center"><span class="badge-order">${item.displayOrder}</span></td>
          <td><span class="badge-id">${item.teamId || '-'}</span></td>
          <td class="team-name-text">${item.teamName || '-'}</td>
          <td class="text-secondary fw-medium">${item.institution || '-'}</td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function showErrorSchedule(msg) {
    document.getElementById('scheduleTableBody').innerHTML = `
      <tr><td colspan="4" class="text-center py-5 text-danger fs-3">❌ เกิดข้อผิดพลาด: ${msg}</td></tr>
    `;
  }

  /* ---------------- โหลดข้อมูล Leaderboard ---------------- */
  function loadLeaderboard() {
    const tbody = document.getElementById('leaderboardTableBody');
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="text-center loading-spinner">
          <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
          <div>กำลังโหลดข้อมูล Leaderboard...</div>
        </td>
      </tr>
    `;

    callBackend('getLeaderboardData')
      .then(renderLeaderboardTable)
      .catch(showErrorLeaderboard);
  }

  function renderLeaderboardTable(res) {
    const headerElem = document.getElementById('leaderboardHeader');
    const tbody = document.getElementById('leaderboardTableBody');

    if (res.status === "error") {
      showErrorLeaderboard(res.message);
      return;
    }

    if (!res.rows || res.rows.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="7" class="text-center py-5 fs-3 text-muted">ไม่พบข้อมูลใน Leaderboard</td></tr>
      `;
      return;
    }

    let headerHtml = '<tr>';
    res.headers.forEach((h, index) => {
      if (index === 1) return;
      const alignClass = (index === 0 || index >= 4) ? 'text-center' : '';
      headerHtml += `<th class="${alignClass}">${h || ''}</th>`;
    });
    headerHtml += '</tr>';
    headerElem.innerHTML = headerHtml;

    const totalRows = res.rows.length;
    let rowsHtml = '';
    
    res.rows.forEach((row, rowIndex) => {
      const reverseDelay = ((totalRows - 1 - rowIndex) * 1.15).toFixed(2);

      rowsHtml += `<tr class="animated-row" style="animation-delay: ${reverseDelay}s;">`;
      row.forEach((cell, colIndex) => {
        if (colIndex === 1) return;

        if (colIndex === 0) {
          let rankClass = 'rank-normal';
          const rankVal = String(cell).trim();
          if (rankVal === '1' || rowIndex === 0) rankClass = 'rank-1';
          else if (rankVal === '2' || rowIndex === 1) rankClass = 'rank-2';
          else if (rankVal === '3' || rowIndex === 2) rankClass = 'rank-3';

          rowsHtml += `<td class="text-center"><span class="rank-badge ${rankClass}">${cell}</span></td>`;
        } else if (colIndex === 2) {
          rowsHtml += `<td class="team-name-text">${cell || '-'}</td>`;
        } else if (colIndex === 3) {
          rowsHtml += `<td class="text-secondary fw-medium">${cell || '-'}</td>`;
        }  else {
          let displayCell = cell;

          // Documents และ Total Score
          if ((colIndex === 6 || colIndex === 7) && cell !== '' && !isNaN(cell)) {
            displayCell = Number(cell).toFixed(1);
          }

          rowsHtml += `<td class="fw-semibold text-center">${cell !== '' ? displayCell : '-'}</td>`;
        }
      });
      rowsHtml += '</tr>';
    });

    tbody.innerHTML = rowsHtml;
  }

  function showErrorLeaderboard(msg) {
    document.getElementById('leaderboardTableBody').innerHTML = `
      <tr><td colspan="7" class="text-center py-5 text-danger fs-3">❌ เกิดข้อผิดพลาด: ${msg}</td></tr>
    `;
  }
  </script>

</body>

</html>
